<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style/style.css">
    <link rel="stylesheet" href="/style/thunbnail.css">
    <link rel="icon" href="./images/Du-Zilla-icon.png">
    <title>Du-Zilla</title>
</head>
<body>
    <nav class="topNav">
      <h1 class="titleIcon">Du-Zilla</h1>
    </nav>

    <section class="globalBox searchSection">
        <div>
            <div style="display: flex;justify-content: center;align-items: center;height: 50px;margin-top: 40px;margin-bottom: 40px;"><h1 class="title">Du-Zilla</h1></div>
            <input class="inputSearch" type="text" placeholder="Search" autocomplete="off">
            <div style="display: flex;justify-content: center;align-items: center;width: 100%;margin-top: 5%;">
              <div class="createOwnButton"><h4 class="normal_text">Create my Own Dz-Page</h4></div>
            </div>
        </div>
        <div class="signButtonsBox">
          <a href="login"><div class="signInButton"><h4 class="normal_text">Sign in</h4></div></a>
          <a href="signUp"><div class="signUpButton"><h4 class="normal_text">Sign Up</h4></div></a>
        </div>
    </section>

    <section class="thunbsSection" style="margin-top: 40px;">


        <box class="thunbMainBox">
          <div class='thunbBanner' style="background-image: url('../images/image-icon.jpg')"></div>      
            <box class="thunbInfoBox">
                <box class="thunbTitleBox">
                  <div style="width:90%;margin-left: 20px;"><h4 class="normal_text">Movie name title</h4></div>  
                </box>
                <box class="thunbUserBox">
                  <img class="userImage" src="../images/user-icon.jpg" style="margin-right: 10px;margin-left: 10px;">
                  <h5 class="normal_text">channel_name</h5>
                  <h6 class="normal_text" style="margin-left: 15px;">000 views</h6>
                      <!-- <div style="display: flex;position: absolute;right: 0;margin-right: 10px;">
                      <div class="diverse_button" ></div>
                        <ul class="show_more" id="show_more">
                          <li><h5 class="normal_text">Report</h5></li>
                          <li><h5 class="normal_text">Save</h5></li>
                          <li><h5 class="normal_text">not interessed</h5></li>
                        </ul>
                     </div> -->
                </box>
            </box>   
        </box>

    </section>
    
</body>
</html>
