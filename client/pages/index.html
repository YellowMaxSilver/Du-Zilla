      <h2 class="titleIcon">Du-Zilla</h2>
      <div class="loadingBox" id="loadingBox"><div class="loadingIcon3"></div></div>
      <div class="accountBox" id="logedBox" style="display: none;">        
        <div class="icon"></div>
        <p class="normal_text" id="accountName">Account Name</p>
        <div class="arrowDownIcon" id="accountDropDownButton"></div>
        <ul class="accountDropDown" id="accountDropDown">
          <li><a href="/account"><div class="dropDownIcon accountIcon"></div><h4 class="normal_text">My Account</h4></a></li>
          <li><a href="/studio/my-projects"><div class="dropDownIcon projectsIcon"></div><h4 class="normal_text">My Projects</h4></a></li>
          <li><a href="/notification"><div class="dropDownIcon notificationIcon"></div><h4 class="normal_text">Notification</h4></a></li>

          <li><a href="/account/settings"><div class="dropDownIcon settingsIcon"></div><h4 class="normal_text">Settings</h4></a></li>
          <li><a href="/help"><div class="dropDownIcon helpIcon"></div><h4 class="normal_text">Help</h4></a></li>
          <li><a href="/logout"><div class="dropDownIcon helpIcon"></div><h4 class="normal_text">Log out</h4></a></li>
        </ul>
      </div>
      <div class="signButtonsBox" id="notLogedBox" style="display: none;">  
          <a href="login"><div class="signInButton"><h4 class="normal_text">Sign in</h4></div></a>
          <a href="signUp"><div class="signUpButton"><h4 class="normal_text">Sign Up</h4></div></a>
      </div>
    </nav>


    <section class="popUpPanel hiddenPopUpPanel" id="choseTemplatePanel">
      <div class="searchTemplateBox">
        <h1 class="normal_text panelTitle">Templates</h1>
        <input class="inputSearch" type="text" placeholder="Pesquisar" autocomplete="off" style="margin-left: 20px;">
        <div class="searchButton" style="margin-left: 10px;"></div>
        <div class="closeButton" id="choseTemplatePanelCloseButton" style="position: absolute;top: 0;right: 0;margin-right: 40px;margin-top: 40px;"></div>
      </div>
      <div class="templatesThunbnailLayout" id="templateBasic">
        <a><div class="templateThunbNail"><div class="templateThunbNailNameBox">Nome do template</div></div></a>
      </div>
    </section>

    <div class="blackFilter hiddenBlackFilter" id="blackFilter"></div>

    <section class="globalBox searchSection">
        <div>
            <div style="display: flex;justify-content: center;align-items: center;height: 50px;margin-top: 40px;margin-bottom: 40px;"><h1 class="title">Du-Zilla</h1></div>
            <div style="display: flex;">
              <input id="search" class="inputSearch" type="text" placeholder="Pesquisar" autocomplete="off">

            </div>
            <div style="display: flex;justify-content: center;align-items: center;width: 100%;margin-top: 5%;">
              <div class="createOwnButton" id="createOwnButton"><h3 class="normal_text">Criar Novo Portfolio</h3></div>
            </div>
        </div>

        </div>
