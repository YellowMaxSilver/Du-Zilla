<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style/signAccount.css">
    <link rel="stylesheet" href="/style/style.css">
    <!-- <link rel="stylesheet" href="../public/style/signAccount.css">
    <link rel="stylesheet" href="../public//style/style.css"> -->
    <title>Login</title>
</head>
<body>
    <script type="module" src="../src/script/sign.ts"></script>
    <div id="notification_section" class="notification_section"></div>


    <div class="mainBox">
        <div class="infoBox">
            <h1 class="title" style="margin-top: 10px;margin-left: 30px;">Du-Zilla</h1>
            <h1 class="darkTitle">Hello! </br>Welcome back to Du-Zila</h1>
            <h3 class="darkNormalText" style="margin-left: 30px;">If you dont have an account, you can sign up <a>here!</a></a></h3>
        </div>
        <div class="signBox">
            <div style="display: flex;justify-content: center;align-items: center;margin-top: 50px;">
                <h2 class="normal_text">Log in</h2>
            </div>


            <input class="signInput" id="emailInput" placeholder="Email" type="email" autocomplete="off" style="margin-top: 10vh;"/><!--EMAIL-->
            <div style="display: flex;align-items: end;position: relative;">
                <input class="signInput" id="passwordInput" placeholder="Password" type="password" style="margin-top: 40px;"/><!--PASSWORD-->
                <div class="visibilityButton" id="visibilityButton" style="margin-bottom: 10px;margin-right: 10%;position: absolute;right: 0;"></div><!--PASSWORD VISIBILITY BUTTON-->
            </div>
            <h5 class="normal_text" style="margin-left: 10%;margin-top: 10px;"><a class="linkText">I forgot my password</a></h5><!--FORGOT PASSWORD-->
            <h5 class="normal_text" style="margin-left: 10%;margin-top: 10px;"><a class="linkText" href="signUp">I don't have an account</a></h5><!--DONT HAVE AN ACCOUNT-->

            
            <div class="loginButton" id="loginButton">
                <h4 id="loginText" class="normal_text">Log in</h4>
                <div id="loginLoading" class="loadingIcon2" style="display: none;"></div>
            </div>
            
            
            
        </div>
        
    </div>

</body>
</html>
