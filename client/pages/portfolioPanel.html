<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style/portfolioPanel.css">
    <title>Portfolio name</title>
</head>
<body class="bodyPanelStyle">
    <nav class="topNav">
      <h1 class="titleIcon">Du-Zilla</h1>
    </nav>

    <section class="attributesPanel">
        <div class="editTextBox">
            <div class="textTitleBox"><p class="normal_text">Portfolio Name</p></div>
            <input placeholder="Portfolio Name" autocomplete="off">
        </div>

        <div class="dropDownBox">
            <p class="normal_text">Personal</p>
        </div>

        <div class="editTextBox description">
            <div class="textTitleBox"><p class="normal_text">Description</p></div>
            <textarea placeholder="Description" autocomplete="off"></textarea>
        </div>

        <div class="editTextBox description tags">
            <div class="textTitleBox"><p class="normal_text">Tags</p></div>
            <textarea placeholder="Tags" autocomplete="off"></textarea>
        </div>

        <div class="uploadImage">
            <div class="textTitleBox"><p class="normal_text">Banner</p></div>
            <div class="blackFilter"></div>
            <div class="background"></div>
        </div>

        <div class="dropDownBox">
            <p class="normal_text">Public</p>
        </div>

    </section>

    <section class="portfolioPanel">

        <div class="editPortfolioBox">
            <div class="textTitleBox"><p class="normal_text">Portfolio</p></div>
            <div class="blackFilter"></div>
            <div class="background"></div>
        </div>
        
    </section>
</body>
</html>
