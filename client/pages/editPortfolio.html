<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style/style.css">
    <link rel="stylesheet" href="/style/editPortfolio.css">
    <script type="module" src="../src/script/editPortfolio.ts"></script>
    <link rel="icon" href="./images/Du-Zilla-icon.png">
    <title>Dz studio: portfolioName</title>
</head>
<body class="editPortFolioBackground">
     <nav class="topNav">
      <h1 class="titleIcon">Du-Zilla</h1>
    </nav>
    <!-- <div class="topBar">  
        <h2>Du-zilla</h2><h2 style="color:rgb(140, 0, 255);margin-left: 20px;">Sites</h2>
    </div> -->


    <section class="editPortfolioAction">
        <input class="uploadElementInput" style="margin-left: 20px;" value="HelloWorld Project">
        <div class="actionButton" id="saveButton" onclick="showHtml()" style="margin-left: 20px;margin-right: 20px;">
          <h4 class="normal_text">Save</h4>
        </div>
        <div class="actionButton" onclick="saveUploadInformations()">
          <h4 class="normal_text">Publish</h4>
        </div>
    </section>

    <section class="attributesPanel" id="attributesPanel" style="display: none;">
        <div class="closeButton" id="attributesPanelCloseButton"></div>
        <h3 class="normal_text" style="margin-left: 20px;">Attributes</h3>
        <div class="attributeInputBox">
            <h4 class="normal_text">Text</h4>
            <textarea class="attributeInput normal_text" id="textInput" placeholder="Text"></textarea>
        </div>
        <div class="attributeInputBox">
            <h4 class="normal_text">Color</h4>
            <input type="color" class="attributeColorInput normal_text" id="colorInput" placeholder="Color" value="#000000">
        </div>
        <div class="attributeInputBox">
            <h4 class="normal_text">Font Size</h4>
            <input class="attributeInput normal_text" id="fontSizeInput" placeholder="Font Size" type="number" min="1" max="1000">
        </div>
        <div class="attributeInputBox">
            <h4 class="normal_text">Font Weight</h4>
            <input class="attributeInput normal_text" id="fontWeightInput" placeholder="Font Weight" type="number" min="100" max="900" step="100">
        </div>
        <div class="attributeInputBox">
            <h4 class="normal_text">Font Algn</h4>
            <input class="attributeInput normal_text" id="fontWeightInput" placeholder="Font Weight" type="number" min="100" max="900" step="100">
        </div>
        <div class="attributeInputBox">
            <h4 class="normal_text">Background Color</h4>
            <input type="color" class="attributeColorInput normal_text" id="backgroundColorInput" placeholder="Background Color" value="#ffffff">
        </div>

        <!-- <div class="attributeInputBox">
            <h4 class="normal_text">Width</h4>
            <input class="attributeInput" id="widthInput" placeholder="Width">
        </div>
        <div class="attributeInputBox">
            <h4 class="normal_text">Height</h4>
            <input class="attributeInput" id="heightInput" placeholder="Height">
        </div> -->
    </section>

    <section class="attributesPanel" id="formAttributesPanel" style="display: none;">
        <div class="closeButton" id="formAttributesPanelCloseButton"></div>
        <h3 class="normal_text" style="margin-left: 20px;">Form Attributes</h3>
        <div class="attributeInputBox">
            <h4 class="normal_text">Form Name</h4>
            <input class="attributeInput normal_text" id="formNameInput" placeholder="Form Name"></input>
        </div>
        <div class="attributeInputBox">
            <h4 class="normal_text">Form Description</h4>
            <input class="attributeInput normal_text" id="formDescriptionInput" placeholder="Form Description"></input>
        </div>
    </section>

    <section class="pagePreviewBox">

        <div id="preview" class="editPreview">
            <div id="selectedBox" class="previewSelected"></div>
            <div id="clickedBox" class="previewClicked">
                <div class="sizePoint bottomRight" id="sizePointBottomRight"></div>
                <div class="sizePoint bottomLeft"></div>
                <div class="sizePoint topRight"></div>
                <div class="sizePoint topLeft"></div>
            </div>
            <div id="createPreviewContent" class="createPreviewContent"></div>
        </div>
        <!-- <iframe id="preview" class="createPreview"></iframe> -->
    </section>
    
</body>
</html>
