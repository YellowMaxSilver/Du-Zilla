<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style/style.css">
    <link rel="stylesheet" href="/style/thunbnail.css">
    <link rel="stylesheet" href="/style/buttons.css">
    <link rel="icon" href="./images/Du-Zilla-icon.png">
    <script type="module" src="/src/script/templateWindow.ts"></script>
    <script type="module" src="/assets/index-DzurZ9o5.js"></script>
    <title>Du-Zilla</title>
</head>
<body>
    <nav class="topNav">
      <h1 class="titleIcon">Du-Zilla</h1>
      <div class="accountBox">
        <div class="icon"></div>
        <p class="normal_text">Account Name</p>
      </div>
      <div class="signButtonsBox" style="display: none;">
          <a href="login"><div class="signInButton"><h4 class="normal_text">Sign in</h4></div></a>
          <a href="signUp"><div class="signUpButton"><h4 class="normal_text">Sign Up</h4></div></a>
      </div>
    </nav>


    <section class="globalBox choseTemplatePanel" id="choseTemplatePanel" style="display: block;">
      <div class="searchTemplateBox">
        <h1 class="normal_text panelTitle">Templates</h1>
        <input class="inputSearch" type="text" placeholder="Pesquisar" autocomplete="off" style="margin-left: 20px;">
        <div class="searchButton" style="margin-left: 10px;"></div>
        <div class="closeButton" id="choseTemplatePanelCloseButton" style="position: absolute;top: 0;right: 0;margin-right: 40px;margin-top: 40px;"></div>
      </div>
      <div class="templatesThunbnailLayout">
        <a href="createPortfolio?id=nweIdAleotery&template=facatemplate"><div class="templateThunbNail"><div class="templateThunbNailNameBox">Nome do template</div></div></a>
      </div>
    </section>

    <section class="globalBox searchSection">
        <div>
            <div style="display: flex;justify-content: center;align-items: center;height: 50px;margin-top: 40px;margin-bottom: 40px;"><h1 class="title">Du-Zilla</h1></div>
            <div style="display: flex;">
              <input class="inputSearch" type="text" placeholder="Pesquisar" autocomplete="off">
              <a href="/search?q=hello"><div class="searchButton" style="margin-left: 10px;"></div></a>
            </div>
            <div style="display: flex;justify-content: center;align-items: center;width: 100%;margin-top: 5%;">
              <div class="createOwnButton" id="createOwnButton"><h4 class="normal_text">Criar Dz-Curriculo</h4></div>
            </div>
        </div>
        <div class="signButtonsBox">
          <a href="login"><div class="signInButton"><h4 class="normal_text">Sign in</h4></div></a>
          <a href="signUp"><div class="signUpButton"><h4 class="normal_text">Sign Up</h4></div></a>
        </div>
    </section>

    <section class="thunbsSection" style="margin-top: 40px;">


        <box class="thunbMainBox">
          <div class='thunbBanner' style="background-image: url('../images/image-icon.jpg')"></div>      
            <box class="thunbInfoBox">
                <box class="thunbTitleBox">
                  <div style="width:90%;margin-left: 20px;"><h4 class="normal_text">Nome do Curriculo</h4></div>  
                </box>
                <box class="thunbUserBox">
                  <img class="userImage" src="../images/user-icon.jpg" style="margin-right: 10px;margin-left: 10px;">
                  <h5 class="normal_text">Nome do usuário</h5>
                  <div class="rateBox">
                    <div class="emptyStarRate"></div>
                    <div class="emptyStarRate"></div>
                    <div class="emptyStarRate"></div>
                    <div class="emptyStarRate"></div>
                    <div class="emptyStarRate"></div>
                  </div>
                </box>
            </box>   
        </box>

    </section>
    
</body>
</html>
