<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style/style.css"/>
    <link rel="stylesheet" href="/style/myProjects.css"/>
    <link rel="stylesheet" href="/style/thunbnail.css">
    <title>My Projects</title>
</head>
<body>
    <nav class="topNav">
      <h1 class="titleIcon">Du-Zilla</h1>
      <div class="accountBox" id="logedBox" style="display: none;">        
        <p class="normal_text" id="accountName">Account Name</p>
        <div class="icon"></div>
      </div>
      <div class="signButtonsBox" id="notLogedBox" style="display: none;">  
          <a href="login"><div class="signInButton"><h4 class="normal_text">Sign in</h4></div></a>
          <a href="signUp"><div class="signUpButton"><h4 class="normal_text">Sign Up</h4></div></a>
      </div>
    </nav>

    <section class="projectsSection">
        <div class="createNewPortfolioButton">Create New Portfolio</div>
        <div class="projectBox normal_text">
            <div class="infoBox">
                <h2>Portfolio name</h2>
                <h4>Personal</h4>
                <h4>00/00/0000 - 00:00</h4>
                <div class="attribute"><div class="icon publicIcon"></div>Public</div>
            </div>


            <box class="thunbMainBox">
            <div class='thunbBanner' style="background-image: url('../images/image-icon.jpg')"></div>      
                <box class="thunbInfoBox">
                    <box class="thunbTitleBox">
                    <div style="width:90%;margin-left: 20px;"><h4 class="normal_text">Nome do Curriculo</h4></div>  
                    </box>
                    <box class="thunbUserBox">
                    <img class="userImage" src="../images/user-icon.jpg" style="margin-right: 10px;margin-left: 10px;">
                    <h5 class="normal_text">Nome do usuário</h5>
                    <div class="rateBox">
                        <div class="emptyStarRate"></div>
                        <div class="emptyStarRate"></div>
                        <div class="emptyStarRate"></div>
                        <div class="emptyStarRate"></div>
                        <div class="emptyStarRate"></div>
                    </div>
                    </box>
                </box>   
            </box>

            <iframe class="portfolioPreview" src="index.html"></iframe>
        </div>

    </section>
    
</body>
</html>
