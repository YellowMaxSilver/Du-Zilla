<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style/style.css">
    <link rel="stylesheet" href="/style/chat.css">
    <script type="module" src="../src/script/chat.ts"></script>
    <script type="module" src="../src/script/main.ts"></script>
    <link rel="icon" href="./images/Du-Zilla-icon.png">

    <!-- <link rel="stylesheet" href="../public/style/style.css">
    <link rel="stylesheet" href="../public/style/chat.css"> -->
    <title>Dz Chat</title>
</head>
<body>
    <nav class="topNav">
      <h2 class="titleIcon">Du-Zilla</h2>
      <div class="loadingBox" id="loadingBox"><div class="loadingIcon3"></div></div>
      <div class="accountBox" id="logedBox" style="display: none;">        
        <div class="icon"></div>
        <p class="normal_text" id="accountName">Account Name</p>
        <div class="arrowDownIcon" id="accountDropDownButton"></div>
        <ul class="accountDropDown" id="accountDropDown">
          <li><a href="/account"><div class="dropDownIcon accountIcon"></div><h4 class="normal_text">My Account</h4></a></li>
          <li><a href="/studio/my-projects"><div class="dropDownIcon projectsIcon"></div><h4 class="normal_text">My Projects</h4></a></li>
          <li><a href="/notification"><div class="dropDownIcon notificationIcon"></div><h4 class="normal_text">Notification</h4></a></li>
          <li><a href="/messager"><div class="dropDownIcon messagerIcon"></div><h4 class="normal_text">Messager</h4></a></li>
          <li><a href="/account/settings"><div class="dropDownIcon settingsIcon"></div><h4 class="normal_text">Settings</h4></a></li>
          <li><a href="/help"><div class="dropDownIcon helpIcon"></div><h4 class="normal_text">Help</h4></a></li>
          <li><a href="/logout"><div class="dropDownIcon helpIcon"></div><h4 class="normal_text">Log out</h4></a></li>
        </ul>
      </div>
      <div class="signButtonsBox" id="notLogedBox" style="display: none;">  
          <a href="login"><div class="signInButton"><h4 class="normal_text">Sign in</h4></div></a>
          <a href="signUp"><div class="signUpButton"><h4 class="normal_text">Sign Up</h4></div></a>
      </div>
    </nav>

    <div class="loadingPopUp"><div class="loadingIcon"></div></div>

    <div class="addNewContactPopUp hiddenPopUpSection" id="addNewContactPopUp">
        <div class="closeIcon" id="addNewContactCloseButton"></div>
        <div class="searchBox">
            <h4 class="normal_text">Add New Contact</h4>
            <input id="searchUserInput" class="normal_text" placeholder="@User" autocomplete="off">
            <div class="searchButton"></div>
        </div>
        <div class="searchContactsBox" id="searchContactsBox">
            <!-- <div class="loadingBox hiddenLoadingBox" id="loadingBox">
                <div class="loadingIcon2"></div>
            </div>
            <div class="noContactsFound" id="noContactsFoundBox">
                <div class="notFoundIcon"></div>
                <h4 class="normal_text">User not found</h4>
            </div> -->
            <!-- <div class="contact">
                <div class="userIcon"></div>
                <h4 class="normal_text">Accont Name</h4>
                <h5 class="normal_text">@account_id</h5>
                <div class="chatButton normal_text">Chat</div>
            </div> -->
        </div>
    </div>
    <div class="blackFilter hiddenBlackFilter" id="blackFilter"></div>

    <section class="mainSection">

        <section class="contactsSection">
            <div class="addNewContactButton" id="addNewContactButton"><h3 class="normal_text">Add new contact</h3></div>
            <h4 class="noContactsFound normal_text">Você não tem nunhum contato</h4>
            <!-- <div class="contact"> 
                <div class="userIcon"></div>
                <div>
                    <h5 class="normal_text">@userId</h5>
                    <h4 class="normal_text">Account name</h4>
                </div>
                <div class="moreIcon"></div>
            </div> -->
        </section>

        <section class="chatSection">
            <div class="contactBox">
                <a><div class="userIcon"></div></a>
                <a><h4 class="normal_text" id="contactUserName">User Name</h4></a>
                <a><h5 class="normal_text" id="contactUserNameId">@userNameId</h5></a>
            </div>
            <div class="messagesBox" id="messagesBox">
                <div class="noMessages">
                    <div class="icon"></div>
                    <h3 class="normal_text">Que tal começar enviando a primeira menssagem</h3>
                </div>
                <!-- <div class="userMessage">
                    <p class="normal_text">Hello whats'up</p>
                    <p class="date normal_text">2 hours ago</p>
                </div>
                <div class="selfMessage">
                    <p class="normal_text">I already say im mr hello the best the warrior forget mr river I will hire if you be my followers.. :)</p>
                    <p class="date normal_text">Now</p>
                </div> -->
            </div>
            <div class="chatBox">
                <textarea id="chatInput" class="darkNormalText" placeholder="Type here"></textarea>
                <div id="chatSendButton" class="sendButton"></div>
            </div>
        </section>
    </section>
    
</body>
</html>
