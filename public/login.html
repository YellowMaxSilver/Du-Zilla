<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style/signAccount.css">
    <link rel="stylesheet" href="style/style.css">
    <title>Log in</title>
</head>
<body>

    <div class="mainBox">
        <div class="infoBox">
            <h1 class="title" style="margin-top: 10px;margin-left: 30px;">Du-Zilla</h1>
            <h1 class="darkTitle">Hello! </br>Welcome back to Du-Zila</h1>
            <h3 class="darkNormalText" style="margin-left: 30px;">If you dont have an account, you can sign up <a>here!</a></a></h3>
        </div>
        <div class="signBox">
            <div style="display: flex;justify-content: center;align-items: center;margin-top: 50px;">
                <h2 class="normal_text">Log in</h2>
            </div>


            <input class="signInput" placeholder="Email" type="email" style="margin-top: 10vh;"/>
            <input class="signInput" placeholder="Password" type="password" style="margin-top: 40px;"/>
            <h5 class="linkText" style="margin-left: 10%;">I forgot my password</h5>
            <h5 class="linkText" style="margin-left: 10%;">I don't have an account</h5>

            <div style="width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: absolute;
            bottom: 0;
            margin-bottom: 10vh;">
                <div class="loginButton">
                    <h3 class="normal_text">Log in</h3>
                </div>
            </div>
            
            
        </div>
        
    </div>

</body>
</html>
